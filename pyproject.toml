[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvxproof"
version = "0.0.1"
description = "Real convex optimization problems whose answers are checked independently of the solver"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Anvesha Churi" }]
dependencies = ["numpy>=1.26", "scipy>=1.11", "cvxpy-base>=1.5", "clarabel>=0.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
